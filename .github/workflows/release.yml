name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish and pack
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          ./scripts/publish-update.ps1 -Version $ver -Changelog "See the GitHub release notes." -Repo "${{ github.repository }}" -SkipGitHub
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @("artifacts/DeGoogleKit-win-x64.zip", "artifacts/latest.json")
          if (gh release view $tag --json tagName 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            $notes = @"
DeGoogle Kit $tag for Windows 10/11 (64-bit).

Publisher: **Opolyonix Corp** (Denmark).

1. Unzip the folder.
2. Run **Setup.cmd** (clears the download mark and installs under your user profile).
3. If Norton or SmartScreen warns, that is an unsigned-build reputation check — restore/allow \`%LOCALAPPDATA%\\Programs\\DeGoogleKit\`. Report false positives at https://submit.norton.com/

Code signing: when \`WINDOWS_CERT_PFX\` is configured in repo secrets, releases are Authenticode-signed.
"@
            gh release create $tag @files --title "DeGoogle Kit $tag" --notes $notes
          }
