name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish and pack
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          ./scripts/publish-update.ps1 -Version $ver -Changelog "See the GitHub release notes." -Repo "${{ github.repository }}" -SkipGitHub
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @("artifacts/DeGoogleKit-win-x64.zip", "artifacts/latest.json")
          if (gh release view $tag --json tagName 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "DeGoogle Kit $tag" --generate-notes
          }
