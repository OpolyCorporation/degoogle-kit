name: Keepalive

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch Supabase so the free plan does not pause
        shell: bash
        run: |
          url=$(python3 -c "import json; print(json.load(open('cloud/supabase.json')).get('url') or '')")
          key=$(python3 -c "import json; print(json.load(open('cloud/supabase.json')).get('anonKey') or '')")
          url=${url:-$SUPABASE_URL}
          key=${key:-$SUPABASE_ANON_KEY}
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "No Supabase URL/anon key yet — skip."
            exit 0
          fi
          curl -fsS -X POST "$url/rest/v1/rpc/touch_keepalive" \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
